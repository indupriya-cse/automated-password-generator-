<!DOCTYPE html>
<html>
<head>
<title>Password Generator</title>
<style>
body{
    font-family: Arial;
    text-align:center;
    margin-top:50px;
}
input,button{
    margin:10px;
    padding:8px;
}
#strength{
    font-weight:bold;
}
</style>
</head>

<body>

<h2>Automated Password Generator</h2>

<label>Password Length:</label>
<input type="number" id="length" value="8"><br>

<label><input type="checkbox" id="upper" checked> Uppercase</label>
<label><input type="checkbox" id="lower" checked> Lowercase</label>
<label><input type="checkbox" id="number" checked> Numbers</label>
<label><input type="checkbox" id="symbol"> Symbols</label><br>

<button onclick="generatePassword()">Generate Password</button>

<h3 id="password"></h3>
<p id="strength"></p>

<script>

function generatePassword(){

let length = document.getElementById("length").value;
let upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let lower = "abcdefghijklmnopqrstuvwxyz";
let numbers = "0123456789";
let symbols = "!@#$%^&*";

let chars = "";

if(document.getElementById("upper").checked) chars += upper;
if(document.getElementById("lower").checked) chars += lower;
if(document.getElementById("number").checked) chars += numbers;
if(document.getElementById("symbol").checked) chars += symbols;

let password = "";

for(let i=0;i<length;i++){
    password += chars.charAt(Math.floor(Math.random()*chars.length));
}

document.getElementById("password").innerText = "Generated Password: " + password;

checkStrength(password);

}

function checkStrength(password){

let strength = "Weak";

if(password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password))
    strength = "Medium";

if(password.length >= 12 && /[A-Z]/.test(password) && /[a-z]/.test(password) && /[0-9]/.test(password) && /[!@#$%^&*]/.test(password))
    strength = "Strong";

document.getElementById("strength").innerText = "Password Strength: " + strength;

}

</script>

</body>
</html>
